services:
  app:
    build:
      context: .
      args:
        VITE_TESTNET_CONTRACT: ${VITE_TESTNET_CONTRACT}
        VITE_MAINNET_CONTRACT: ${VITE_MAINNET_CONTRACT:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:?Set frontend HTTPS origin}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      AI_ALLOW_REMOTE: "true"
      AI_ALLOWED_WALLETS: ${AI_ALLOWED_WALLETS:?Set allowed wallet addresses}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-50}
      AI_WALLET_DAILY_LIMIT: ${AI_WALLET_DAILY_LIMIT:-10}
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  backup:
    build: .
    command: ["node", "scripts/backup-loop.js"]
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: 6
    volumes:
      - app_data:/data
      - app_backups:/backups
    depends_on:
      app:
        condition: service_healthy
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  app_data:
  app_backups:
  caddy_data:
  caddy_config:
