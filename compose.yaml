# Optional frontend/relay host. Application data lives in Supabase.
services:
  app:
    build:
      context: .
      args:
        VITE_TESTNET_CONTRACT: ${VITE_TESTNET_CONTRACT}
        VITE_MAINNET_CONTRACT: ${VITE_MAINNET_CONTRACT:-}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      SUPABASE_API_URL: ${SUPABASE_API_URL:-https://lbdeosccicyqrjevshya.supabase.co/functions/v1/motochain-api}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
